<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>XS Việt Nam - Cầu</title>

<style>

.cau-board{position:relative}
.cau-column{position:relative;z-index:1}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef1f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button,input,textarea{font-family:inherit}
button{border:0;outline:0}

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ================= CHỌN ĐÀI ================= */

#stationScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  height:44px;
  flex:none;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 8px;
}

.user{
  padding:5px 9px;
  border-radius:14px;
  background:#f1f3f6;
  color:#777;
  font-size:9px;
}

.header-icons{
  display:flex;
  gap:4px;
}

.h-icon{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#f2f3f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.station-title{
  height:30px;
  flex:none;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  padding-left:8px;
  color:#159eea;
  font-size:9px;
  font-weight:900;
}

.station-content{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
  padding:4px;
  overflow:hidden;
}

/* VIETLOTT chỉ có một nhóm nên ẩn cột điều hướng dư thừa. */
.station-content .region-sidebar{display:none}
.station-content .stations{width:100%}

.region-sidebar{
  width:62px;
  flex:none;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
}

.region-btn{
  width:100%;
  height:64px;
  padding:2px;
  background:#fff;
  color:#666;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:6.5px;
  line-height:8px;
  font-weight:800;
}

.region-btn.active{
  color:#159eea;
  background:#e7f6ff;
  border-left:3px solid #159eea;
}

.region-icon{
  width:20px;
  height:20px;
  border:1px solid #aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
}

.stations{
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.station-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.station-card{
  position:relative;
  height:82px;
  background:#fff;
  border-radius:12px;
  text-align:left;
  padding:9px;
  box-shadow:0 4px 12px rgba(32,91,128,.07);
}

.station-card:active{transform:scale(.98)}

.station-number{
  color:#159eea;
  font-size:7px;
  font-weight:900;
}

.station-name{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
}

.station-day{
  margin-top:4px;
  color:#888;
  font-size:7px;
}

.station-circle{
  position:absolute;
  right:5px;
  bottom:5px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#e6f6ff;
  color:#159eea;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
  font-weight:900;
}

/* ================= MÀN CẦU ================= */

#cauScreen{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
  padding:4px;
}

.cau-header{
  height:40px;
  flex:none;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:2px 4px;
  margin-bottom:4px;
}

.back{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f1f2f5;
  color:#555;
  font-size:20px;
}

.cau-station{margin-left:5px}

.cau-station strong{
  display:block;
  font-size:10px;
  font-weight:900;
}

.cau-station span{
  display:block;
  color:#888;
  font-size:6.5px;
}

/* ================= KẾT QUẢ ================= */

.result-top{
  width:100%;
  box-sizing:border-box;
  flex:none;
  margin-bottom:4px;
  background:linear-gradient(135deg,#ffffff 0%,#f8fbff 100%);
  border:1px solid #d7e3ee;
  border-radius:12px;
  box-shadow:0 4px 14px rgba(32,91,128,.08);
  overflow:hidden;
}

.selected-latest{
  width:100%;
  box-sizing:border-box;
  min-height:52px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:8px 10px;
  margin-bottom:5px;
  border-radius:10px;
  color:#d00000;
  background:#fff;
  border:1px solid #fecaca;
  box-shadow:0 4px 12px rgba(185,28,28,.08);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.selected-latest:active{transform:scale(.99);background:#fff1f2}
.selected-latest-title{font-size:8px;font-weight:950}
.selected-latest-number{max-width:100%;font-size:clamp(13px,4.4vw,18px);font-weight:950;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selected-latest-date{font-size:7px;font-weight:800;color:#991b1b}

.top-history-list{
  display:none;
  width:100%;
  box-sizing:border-box;
  max-height:210px;
  overflow-y:auto;
  margin-top:5px;
  border:1px solid #fecaca;
  border-radius:9px;
  background:#fff;
}

.top-history-list.open{display:block}
.top-history-row{
  display:grid;
  grid-template-columns:88px minmax(0,1fr);
  align-items:center;
  min-height:42px;
  column-gap:12px;
  padding:6px 10px;
  border-top:1px solid #fee2e2;
  color:#d00000;
  font-size:clamp(13px,4vw,17px);
  font-weight:900;
}
.top-history-row:first-child{border-top:0}
.top-history-date{font-size:clamp(11px,3.2vw,15px);font-weight:900;color:#991b1b;text-align:center;white-space:nowrap}
.top-history-row>span:last-child{min-width:0;overflow:hidden;padding-left:4px;text-align:left;text-overflow:ellipsis;white-space:nowrap}

.jackpot-card{
  width:100%;
  min-height:72px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:6px;
  padding:8px;
  margin:0 0 5px;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(135deg,#172554,#2563eb 58%,#38bdf8);
  box-shadow:0 5px 16px rgba(37,99,235,.2);
}

.jackpot-label{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:space-between;
  gap:2px;
  font-size:8px;
  font-weight:900;
  letter-spacing:.3px;
}

.jackpot-label span{
  color:#bfdbfe;
  font-size:6.5px;
  font-weight:700;
}

.jackpot-value{
  text-align:center;
  font-size:12px;
  font-weight:950;
  white-space:nowrap;
}

.jackpot-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}

.jackpot-box{
  min-width:0;
  padding:6px 4px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:8px;
  background:rgba(15,23,42,.22);
}

.jackpot-box-title{
  margin-bottom:2px;
  color:#dbeafe;
  font-size:7px;
  font-weight:900;
  text-align:center;
}

.jackpot-second{
  color:#fff;
  font-size:12px;
  font-weight:800;
  text-align:center;
  white-space:nowrap;
}

.jackpot-date{
  color:#dbeafe;
  font-size:6.5px;
  text-align:center;
}

/* ================= NHẬP ================= */

.open-input{
  width:100%;
  height:30px;
  flex:none;
  margin-bottom:4px;
  border-radius:9px;
  background:#fff;
  color:#159eea;
  font-size:7px;
  font-weight:900;
}

.cau-main{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
}

.position-column{
  width:44px;
  flex:none;
  background:#fff;
  border-radius:7px;
  overflow-y:auto;
  overflow-x:hidden;
}

.position-btn{
  width:100%;
  height:34px;
  min-height:34px;
  padding:2px;
  background:#fff;
  color:#555;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:7px;
  line-height:15px;
  font-weight:800;
}

.position-btn[data-pos="dbTruc"],
.position-btn[data-pos="dbDv"],
.position-btn[data-pos="dbSum2Last"]{
  color:#f00;
}

.position-btn.active{
  background:#e7f6ff;
  color:#159eea;
  border-left:3px solid #159eea;
}

.cau-right{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.cau-tabs{
  flex:none;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.cau-tab{
  height:30px;
  border-radius:6px;
  background:#fff;
  color:#666;
  font-size:7px;
  font-weight:900;
}

.cau-tab.active{
  background:linear-gradient(135deg,#159eea,#2563eb);
  color:#fff;
}

.cau-content{
  flex:1;
  min-height:0;
  margin-top:3px;
  background:linear-gradient(180deg,#e7f7ff 0%,#d8f0ff 100%);
  border:1px solid #c8e6f7;
  border-radius:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  overflow-x:hidden;
  overflow-y:auto;
  padding:6px;
  direction:rtl;
  touch-action:pan-y;
  overscroll-behavior-x:contain;
}

.cau-title{
  text-align:center;
  color:#159eea;
  font-size:7.5px;
  font-weight:900;
  margin-bottom:6px;
  display:none;
}

/* ================= DỰ ĐOÁN ================= */

.predict-area{
  width:100%;
  margin-bottom:5px;
}

.predict-buttons{
  display:flex;
  gap:5px;
}

.predict-buttons button{
  width:80px;
  height:28px;
  padding:0;
  border:1px solid #159eea;
  border-radius:5px;
  background:#fff;
  color:#159eea;
  font-size:9px;
  font-weight:700;
}

.predict-buttons button.flash{
  animation:buttonFlash .12s ease;
}

@keyframes buttonFlash{
  0%{
    background:#eaf7ff;
    color:#159eea;
  }
  100%{
    background:#fff;
    color:#159eea;
  }
}

.predict-stats{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:4px;
  min-height:12px;
  font-size:7px;
  font-weight:900;
  color:#555;
}

.predict-mark{
  position:absolute;
  z-index:100;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  pointer-events:none;
  animation:predictionBlink .55s steps(1,end) infinite;
}

@keyframes predictionBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}

.predict-mark.t{color:#e53935}
.predict-mark.x{color:#168bd0}

/* ================= CARO ================= */

.cau-board-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:none;
  touch-action:pan-x;
  scroll-behavior:auto;
  scrollbar-width:none;
  direction:ltr;
  padding-bottom:2px;
}
.cau-board-wrap::-webkit-scrollbar{
  display:none;
}
.cau-scrollbar{
  width:100%;
  height:10px;
  margin-top:3px;
  padding:2px 0;
  background:#d5dce3;
  border-radius:8px;
  box-sizing:border-box;
  position:relative;
  touch-action:none;
}
.cau-scrollbar-thumb{
  position:absolute;
  left:0;
  top:2px;
  height:6px;
  min-width:28px;
  background:#8b98a6;
  border-radius:6px;
  transform:translateX(0);
  touch-action:none;
}

.cau-board{
  position:relative;
  width:max-content;
  min-width:100%;
  display:flex;
  align-items:flex-start;
  gap:3px;
  border:1px solid rgba(21,158,234,.65);
  border-radius:4px;
  background-color:#cfeeff;
  background-image:
    linear-gradient(
      rgba(21,158,234,.22) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(21,158,234,.22) 1px,
      transparent 1px
    );
  background-size:27px 27px;
  background-position:0 0;
  padding-right:3px;
  direction:ltr;
}

.cau-column{
  width:24px;
  min-width:24px;
  display:flex;
  flex-direction:column;
  gap:3px;
  transform:translateX(1.5px);
}

.cau-cell{
  width:24px;
  height:24px;
  min-width:24px;
  min-height:24px;
  border-radius:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  padding:0;
  margin:0;
}

.tai,.le,.prime{
  color:#e53935;
  background:transparent;
}

.xiu,.chan,.composite{
  color:#168bd0;
  background:transparent;
}

/* ================= MÀN NHẬP ================= */

#inputScreen{
  display:none;
  position:absolute;
  z-index:50;
  inset:4px;
  background:#eef1f5;
  flex-direction:column;
}

.input-header{
  height:34px;
  flex:none;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px 5px;
  margin-bottom:4px;
}

.input-header-title{
  color:#159eea;
  font-size:9px;
  font-weight:900;
}

.input-close{
  height:25px;
  padding:0 9px;
  border-radius:5px;
  background:#f0f1f4;
  color:#555;
  font-size:7px;
  font-weight:900;
}

.input-area{
  flex:1;
  min-height:0;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.input-titles{
  width:100%;
  height:27px;
  flex:none;
  display:grid;
grid-template-columns:1fr 2fr;
  border-bottom:1px solid #eee;
  box-sizing:border-box;
}

.input-title{
  min-width:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7.5px;
  font-weight:900;
  box-sizing:border-box;
}

.input-title:first-child{
  color:#159eea;
}

.input-title:nth-child(2){
  color:#d00000;
}

.input-title:last-child{
  color:#111;
}

.input-scroll{
  width:100%;
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  box-sizing:border-box;
}

.input-grid{
  display:flex;
  flex-direction:column;
  width:100%;
  min-width:0;
  max-width:100%;
  padding:4px;
  gap:4px;
  box-sizing:border-box;
}

.input-row-horizontal{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:0;
  align-items:center;
  box-sizing:border-box;
  border:1px solid #cfd5dc;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}

.input-row-horizontal .data-row{
  width:100%;
  min-width:0;
  max-width:100%;
  height:37px;
  margin:0;
  overflow:visible;
  box-sizing:border-box;
  border-right:1px solid #cfd5dc;
}

.input-row-horizontal .data-row:last-child{
  border-right:0;
}

.date-input{
  width:100%;
  height:35px;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  background:#fff;
  color:#159eea;
  text-align:center;
  font-size:20px;
  font-weight:900;
  box-sizing:border-box;
}

.row-input{
  display:block;
  width:100%;
  min-width:0;
  max-width:100%;
  height:35px;
  min-height:35px;
  resize:none;
  overflow:hidden;
  padding:0 3px;
  border:0;
  border-radius:0;
  outline:none;
  background:#fff;
  text-align:center;
  font-size:20px;
  line-height:31px;
  font-weight:900;
  letter-spacing:1px;
  caret-color:#159eea;
  box-sizing:border-box;
}

.row-input.db-input{
  color:#d00000;
  border:0;
}

.row-input.g1-input{
  color:#111;
  border:0;
}

.row-input.locked{
  cursor:not-allowed;
  opacity:1;
}

.row-input.db-input.locked{
  background:#ffecec;
}

.row-input.g1-input.locked{
  background:#eeeeee;
}

#dbInputColumn .row-input.locked{
  background:#ffecec;
}

#g1InputColumn .row-input.locked{
  background:#eeeeee;
}

.add-area{
  height:38px;
  flex:none;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:4px;
}

.add-btn{
  height:29px;
  border-radius:5px;
  background:#159eea;
  color:#fff;
  font-size:7px;
  font-weight:900;
}

@media(max-width:380px){

  .region-sidebar{
    width:59px;
  }

  .position-column{
    width:58px;
  }

  .position-btn{
    font-size:6px;
  }

  .row-input{
    font-size:19px;
  }

}

</style>
<style id="vietlott-single-result-style">
#g1Result, #g1ResultBox, .g1-result, .result-g1 { display:none !important; }
</style>
</head>

<body>

<div class="app">

<section id="stationScreen">

  <div class="header">

    <div class="user">
      Xin chào
    </div>

    <div class="header-icons">
      <div class="h-icon">💬</div>
      <div class="h-icon">♜</div>
    </div>

  </div>

  <div class="station-title" id="regionTitle">
    XS MIỀN BẮC VN
  </div>

  <div class="station-content">

    <aside class="region-sidebar">
    <button type="button" class="region-btn active" data-region="vietlott">
      <div class="region-icon">VL</div>
      <span>VIETLOTT</span>
    </button>
  </aside>

    <main class="stations">
      <div class="station-grid" id="stationGrid"></div>
    </main>

  </div>

</section>

<section id="cauScreen">

  <div class="cau-header">

    <button type="button" class="back" id="backBtn">
      ‹
    </button>

    <div class="cau-station">
      <strong id="stationName"></strong>
      <span id="stationDay"></span>
    </div>

  </div>

  <div class="result-top">

    <div class="selected-latest" id="selectedLatest">
      <div class="selected-latest-title" id="selectedLatestTitle">KẾT QUẢ MỚI NHẤT</div>
      <div class="selected-latest-number" id="selectedLatestNumber">—</div>
      <div class="selected-latest-date" id="selectedLatestDate"></div>
    </div>

    <div class="top-history-list" id="topHistoryList"></div>

  </div>

  <div class="jackpot-card" id="jackpotCard">
    <div class="jackpot-label">
      <strong id="jackpotGame">JACKPOT</strong>
      <span id="jackpotLabel">Giá trị kỳ mới nhất</span>
    </div>
    <div class="jackpot-grid">
      <div class="jackpot-box">
        <div class="jackpot-box-title">JACKPOT 1</div>
        <div class="jackpot-value" id="jackpotValue">Đang cập nhật…</div>
      </div>
      <div class="jackpot-box">
        <div class="jackpot-box-title">JACKPOT 2</div>
        <div class="jackpot-second" id="jackpotSecond">—</div>
      </div>
    </div>
    <div class="jackpot-date" id="jackpotDate"></div>
  </div>

  <button type="button" class="open-input" id="openInput">
    NHẬP DỮ LIỆU
  </button>

  <div class="cau-main">

function formatVietlottData(value){
  const digits = String(value ?? "").replace(/\D/g, "");
  const pairCount = digits.length >= 14 ? 7 : Math.floor(digits.length / 2);
  const pairs = [];
  for(let i = 0; i < pairCount; i++){
    const pair = digits.slice(i * 2, i * 2 + 2);
    if(pair.length === 2) pairs.push(pair);
  }
  return pairs.join("-");
}

function syncJackpotCache(){
  const rows=onlineStore[currentStation]?.db || [];
  if(!rows.length){
    return loadJackpotCache();
  }

  const cache=loadJackpotCache();
  const old=cache[currentStation] || {};
  const items={
    ...(old.items||{})
  };
  let changed=false;

  // Lưu từng kỳ, không chỉ lưu một Jackpot cuối cùng.
  rows.forEach(row=>{
    if(!row?.sourceDate || !row?.jackpot){
      return;
    }

    const amount=typeof row.jackpot==="object"
      ? row.jackpot?.amount
      : row.jackpot;

    if(!amount){
      return;
    }

    const next={
      sourceDate:row.sourceDate,
      sourceDateText:row.sourceDateText||"",
      amount:String(amount),
      label:
        typeof row.jackpot==="object"
          ? row.jackpot.label||"Jackpot"
          : "Jackpot",
      jackpot2:
        typeof row.jackpot==="object"
          ? row.jackpot.jackpot2||null
          : null,
      updatedAt:Date.now()
    };

    if(
      !items[row.sourceDate] ||
      items[row.sourceDate].amount!==next.amount ||
      items[row.sourceDate].label!==next.label ||
      items[row.sourceDate].jackpot2?.amount!==next.jackpot2?.amount
    ){
      items[row.sourceDate]=next;
      changed=true;
    }
  });

  const latest=rows.find(row=>
    row?.sourceDate &&
    items[row.sourceDate]
  );

  if(changed || !old.items){
    cache[currentStation]={
      ...old,
      ...(
        latest && items[latest.sourceDate]
          ? items[latest.sourceDate]
          : {}
      ),
      items,
      updatedAt:Date.now()
    };
    saveJackpotCache(cache);
  }

  return cache;
}

function workerDateToIso(date){

  const s=String(date||"").trim();

  if(!s){
    return "";
  }

  /* ISO: 2026-09-08 */
  let m=s.match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})/
  );

  if(m){

    return (
      m[1]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[3]).padStart(2,"0")
    );

  }

  /* DD/MM/YYYY hoặc DD-MM-YYYY */
  m=s.match(
    /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
  );

  if(m){

    return (
      m[3]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[1]).padStart(2,"0")
    );

  }

  return "";

}


async function syncOnlineResults(){

  if(autoSyncBusy) return;
  autoSyncBusy=true;

  try{

    // Kích hoạt Worker để lấy các kỳ mới trước khi đọc /latest.
    // Nếu Worker tạm thời bận/lỗi, vẫn đọc dữ liệu gần nhất bên dưới.
    try{
      const runController=new AbortController();
      const runTimeout=setTimeout(
        ()=>runController.abort(),
        20000
      );
      await fetch(
        VIETLOTT_RUN_API+"?from=app&t="+Date.now(),
        {
          method:"GET",
          cache:"no-store",
          signal:runController.signal
        }
      );
      clearTimeout(runTimeout);
    }catch(runError){
      console.warn(
        "Worker run bỏ qua, đọc dữ liệu gần nhất:",
        runError
      );
    }

    const res=await fetch(
      VIETLOTT_API+"?t="+Date.now(),
      {
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!res.ok){
      throw new Error(
        "WORKER HTTP "+res.status
      );
    }

    const payload=await res.json();

    function convertRows(game){

      const source =
        payload &&
        payload[game] &&
        Array.isArray(payload[game].rows)
          ? payload[game].rows
          : [];

      const need =
        game==="power655" ? 7 : 6;

      const max =
        game==="power655" ? 55 : 45;

      const rows=[];

      source.forEach((raw,index)=>{

        if(!raw || typeof raw!=="object"){
          return;
        }

        const nums =
          Array.isArray(raw.result)
            ? raw.result.map(Number)
            : [];

        if(nums.length!==need){
          return;
        }

        if(!nums.every(
          n =>
            Number.isInteger(n) &&
            n>=1 &&
            n<=max
        )){
          return;
        }

        const iso=
          workerDateToIso(raw.date);

        if(
          !/^\d{4}-\d{2}-\d{2}$/.test(iso)
        ){
          return;
        }

        const resultNumber=
          nums
            .map(n=>String(n).padStart(2,"0"))
            .join("");

        const drawId=
          String(
            raw.id ||
            game+"_"+iso ||
            index
          );

        rows.push({

          id:
            game+"_"+drawId+"_db",

          rowId:
            game+"_"+drawId,

          number:
            resultNumber,

          locked:true,

          created:
            new Date(
              iso+
              "T00:00:00+07:00"
            ).getTime(),

          sourceDate:
            iso,

          sourceDateText:
            iso
              .split("-")
              .reverse()
              .join("/"),

          online:true,

          game,

          jackpot:
            raw.jackpot ||
            "",

          drawId:
            drawId

        });

      });

      rows.sort((a,b)=>
        String(b.sourceDate)
          .localeCompare(
            String(a.sourceDate)
          )
      );

      return rows;

    }

    onlineStore={

      mega645:{
        db:
          convertRows("mega645"),
        g1:[]
      },

      power655:{
        db:
          convertRows("power655"),
        g1:[]
      }

    };

    updateJackpot();

    if(
      cauScreen &&
      cauScreen.style.display!=="none"
    ){

      loadLatest();
      drawCau();

    }

    console.log(
      "VIETLOTT WORKER SYNC OK",
      {
        mega:
          onlineStore
            .mega645
            .db
            .length,

        power:
          onlineStore
            .power655
            .db
            .length
      }
    );

  }catch(err){

    console.error(
      "VIETLOTT WORKER SYNC ERROR:",
      err
    );

  }finally{

    autoSyncBusy=false;

  }

}

/* =====================================================

function getIsoDateForCurrentDay(){

  if(currentDay==="ALL"){
    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).format(new Date());
  }

  if(currentDay){

    const now=
      new Date();

    const current=
      getDateDayCode(
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone:"Asia/Ho_Chi_Minh",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
          }
        ).format(now)
      );

    if(current===currentDay){

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:"Asia/Ho_Chi_Minh",
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).format(now);

    }

    const target=
      {
        T2:1,
        T3:2,
        T4:3,
        T5:4,
        T6:5,
        T7:6,
        CN:0
      }[currentDay];

    const d=
      new Date(now);

    const diff=
      (target-d.getDay()+7)%7;

    d.setDate(
      d.getDate()-diff
    );

    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).format(d);

  }

  const now=
    new Date();

  const parts=
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(now);

  const obj={};

  parts.forEach(p=>{

    if(p.type!=="literal"){
      obj[p.type]=p.value;
    }

  });

  return (
    obj.year+
    "-"+
    obj.month+
    "-"+
    obj.day
  );

}

/* =====================================================
   MỚI NHẤT -> CŨ NHẤT
===================================================== */

function newest(list,type){

  const len=type==="g1" ? 2 : digitLength("db");
  const re=new RegExp("^\\d{"+len+"}$");
  const map=new Map();

  (Array.isArray(list)?list:[]).forEach((x,index)=>{
    if(!x) return;
    const number=String(x.number||"").replace(/\D/g,"");
    if(!re.test(number)) return;

    const date=String(x.sourceDate||"").trim();
    const key=(date&&/^\d{4}-\d{2}-\d{2}$/.test(date))
      ?"date:"+date
      :"row:"+String(x.rowId||x.id||index);

    map.set(key,{...x,number:number});
  });

  return Array.from(map.values()).sort((a,b)=>{
    const da=String(a.sourceDate||"");
    const db=String(b.sourceDate||"");
    return da!==db
      ?db.localeCompare(da)
      :(Number(b.created)||0)-(Number(a.created)||0);
  });
}

/* =====================================================
   LẤY CHỮ SỐ / TỔNG
===================================================== */

function getDigits(){

  const data=ensureCurrent();
  const draws=newest(data.db,"db");

  if(!draws.length) return [];

  const isPower=currentStation==="power655";
  const maxDigits=isPower?14:12;

  if(currentPosition.startsWith("digit")){
    const index=Number(currentPosition.slice(5));
    if(!Number.isInteger(index)||index<0||index>=maxDigits) return [];

    return draws
      .map(x=>String(x.number||"")[index])
      .filter(x=>x!==undefined);
  }

  if(currentPosition.startsWith("sum")){
    const pair=Number(currentPosition.slice(3));
    if(!Number.isInteger(pair)||pair<0||pair>=maxDigits/2) return [];

    const a=pair*2;
    return draws
      .map(x=>{
        const n=String(x.number||"");
        if(n.length!==maxDigits) return null;
        return String((Number(n[a])+Number(n[a+1]))%10);
      })
      .filter(x=>x!==null);
  }

  return [];
}

/* =====================================================
   PHÂN LOẠI
===================================================== */

function classifyDigit(digit){

  const n=
    String(digit);

  if(currentType==="tx"){

    return [
      "5","6","7","8","9"
    ].includes(n)
      ?"T"
      :"X";

  }

  if(currentType==="cl"){

    return [
      "0","2","4","6","8"
    ].includes(n)
      ?"E"
      :"O";

  }

  if(currentType==="ps"){

    return [
      "1","2","3","5","7"
    ].includes(n)
      ?"P"
      :"C";

  }

  return "";

}

/* =====================================================
   DỰNG CẦU
===================================================== */

function buildBridge(values){

  const ROWS=6;
  const board=[];

  if(
    !Array.isArray(values) ||
    !values.length
  ){
    return board;
  }

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    values[0];

  let count=1;

  for(
    let i=1;
    i<values.length;
    i++
  ){

    if(values[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        values[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;

  runs.forEach(run=>{

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  });

  return board;

}

/* =====================================================
   TÌM TỌA ĐỘ TAY TIẾP THEO
===================================================== */

function getPredictionPosition(
  values,
  predictedValue
){

  if(
    !Array.isArray(values) ||
    !values.length ||
    !predictedValue
  ){
    return null;
  }

  const ROWS=6;

  const testValues=
    values.concat(
      predictedValue
    );

  const board=[];

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    testValues[0];

  let count=1;

  for(
    let i=1;
    i<testValues.length;
    i++
  ){

    if(testValues[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        testValues[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;
  let lastPosition=null;

  for(const run of runs){

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      lastPosition={
        row:r,
        col:c
      };

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  }

  return lastPosition;

}

function updatePredictionStats(){

  const digits=
    getDigits();

  if(!digits.length){

    predictStats.innerHTML="";

    return;

  }

  const values=
    digits.map(
      classifyDigit
    );

  if(currentType==="tx"){

    const t=
      values.filter(
        x=>x==="T"
      ).length;

    const x=
      values.filter(
        x=>x==="X"
      ).length;

    const total=
      t+x;

    const tp=
      total
        ?Math.round(t/total*100)
        :0;

    const xp=
      total
        ?Math.round(x/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        B: ${t} lần — ${tp}%
      </span>
      <span>
        S: ${x} lần — ${xp}%
      </span>
    `;

    return;

  }

  if(currentType==="cl"){

    const c=
      values.filter(
        x=>x==="E"
      ).length;

    const l=
      values.filter(
        x=>x==="O"
      ).length;

    const total=
      c+l;

    const cp=
      total
        ?Math.round(c/total*100)
        :0;

    const lp=
      total
        ?Math.round(l/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        C: ${c} lần — ${cp}%
      </span>
      <span>
        L: ${l} lần — ${lp}%
      </span>
    `;

    return;

  }

  if(currentType==="ps"){

    const s=
      values.filter(
        x=>x==="P"
      ).length;

    const h=
      values.filter(
        x=>x==="C"
      ).length;

    const total=
      s+h;

    const sp=
      total
        ?Math.round(s/total*100)
        :0;

    const hp=
      total
        ?Math.round(h/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        SNT: ${s} lần — ${sp}%
      </span>

      <span>
        SH: ${h} lần — ${hp}%
      </span>

    `;

  }

}

function drawCau(){

  updatePredictionButtons();

  if(currentType==="tx"){

    cauTitle.textContent=
      "CẦU TÀI / XỈU";

  }

  else if(currentType==="cl"){

    cauTitle.textContent=
      "CẦU CHẴN / LẺ";

  }

  else if(currentType==="ps"){

    cauTitle.textContent=
      "CẦU SNT / SH";

  }

  const digits=
    getDigits();

  updatePredictionStats();

  cauArea.innerHTML="";

  if(!digits.length){

    cauArea.innerHTML=`

      <div class="no-data">
        Chưa có dữ liệu
      </div>

    `;

    return;

  }

  const values=
    digits
      .slice()
      .reverse()
      .map(
        classifyDigit
      );

  const bridge=
    buildBridge(values);

  const board=
    document.createElement("div");

  board.className="cau-board";

  let maxCols=0;

  for(
    let r=0;
    r<6;
    r++
  ){

    if(
      bridge[r] &&
      bridge[r].length>maxCols
    ){

      maxCols=
        bridge[r].length;

    }

  }

  for(
    let c=0;
    c<maxCols;
    c++
  ){

    const column=
      document.createElement("div");

    column.className=
      "cau-column";

    let hasCell=false;

    for(
      let r=0;
      r<6;
      r++
    ){

      const value=
        bridge[r] &&
        bridge[r][c];

      if(value){

        column.appendChild(
          makeCell(value)
        );

        hasCell=true;

      }else{

        const empty=
          document.createElement("div");

        empty.style.width="24px";
        empty.style.height="24px";
        empty.style.flex="none";

        column.appendChild(empty);

      }

    }

    if(hasCell){

      board.appendChild(column);

    }

  }

  for(
    let i=0;
    i<4;
    i++
  ){

    const emptyColumn=
      document.createElement("div");

    emptyColumn.className=
      "cau-column";

    for(
      let r=0;
      r<6;
      r++
    ){

      const empty=
        document.createElement("div");

      empty.style.width="24px";
      empty.style.height="24px";
      empty.style.flex="none";

      emptyColumn.appendChild(empty);

    }

    board.appendChild(
      emptyColumn
    );

  }

  if(
    prediction==="T" ||
    prediction==="X" ||
    prediction==="E" ||
    prediction==="O" ||
    prediction==="P" ||
    prediction==="C"
  ){

    const nextPos=
      getPredictionPosition(
        values,
        prediction
      );

    if(nextPos){

      const mark=
        document.createElement("div");

      mark.className=
        "predict-mark";

      if(
        prediction==="T" ||
        prediction==="O" ||
        prediction==="P"
      ){

        mark.classList.add("t");

      }else{

        mark.classList.add("x");

      }

      mark.textContent=
        prediction==="T"
          ?"B"
          :prediction==="X"
            ?"S"
            :prediction;

      mark.style.left=
        (
          nextPos.col*27+
          1.5+
          1
        )+
        "px";

      mark.style.top=
        (
          nextPos.row*27+
          1
        )+
        "px";

      board.appendChild(mark);

    }

  }

  const boardWrap=document.createElement("div");
  boardWrap.className="cau-board-wrap";
  boardWrap.appendChild(board);

  /* Thanh con lăn riêng, luôn nhìn thấy trên iPhone/iPad. */
  const scrollBar=document.createElement("div");
  scrollBar.className="cau-scrollbar";

  const scrollThumb=document.createElement("div");
  scrollThumb.className="cau-scrollbar-thumb";
  scrollBar.appendChild(scrollThumb);

  cauArea.appendChild(boardWrap);
  cauArea.appendChild(scrollBar);

  function updateCauScrollbar(){
    const view=boardWrap.clientWidth;
    const total=boardWrap.scrollWidth;
    const track=scrollBar.clientWidth;

    if(!view || !total || !track) return;

    const maxScroll=Math.max(0,total-view);

    if(maxScroll<=0){
      scrollBar.style.display="none";
      return;
    }

    scrollBar.style.display="block";

    const thumbW=Math.max(
      28,
      track*(view/total)
    );

    const maxThumb=track-thumbW;
    const left=maxScroll>0
      ? (boardWrap.scrollLeft/maxScroll)*maxThumb
      : 0;

    scrollThumb.style.width=thumbW+"px";
    scrollThumb.style.transform="translateX("+left+"px)";
  }

  boardWrap.addEventListener("scroll",updateCauScrollbar,{passive:true});
  window.addEventListener("resize",updateCauScrollbar);

  /* Kéo trực tiếp vào con lăn. */
  let barDragStartX=0;
  let barStartScroll=0;

  scrollThumb.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(inertiaFrame){
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame=0;
    }
    barDragStartX=e.touches[0].clientX;
    barStartScroll=boardWrap.scrollLeft;
  },{passive:false});

  scrollThumb.addEventListener("touchmove",function(e){
    e.preventDefault();

    const total=boardWrap.scrollWidth;
    const view=boardWrap.clientWidth;
    const track=scrollBar.clientWidth;
    const thumbW=scrollThumb.offsetWidth;
    const maxScroll=Math.max(0,total-view);
    const maxThumb=Math.max(1,track-thumbW);

    boardWrap.scrollLeft=
      barStartScroll+
      (e.touches[0].clientX-barDragStartX)*
      (maxScroll/maxThumb);

    updateCauScrollbar();
  },{passive:false});

  /* Bấm vào rãnh: nhảy tới vị trí tương ứng. */
  scrollBar.addEventListener("touchstart",function(e){
    if(e.target===scrollThumb) return;

    const rect=scrollBar.getBoundingClientRect();
    const track=scrollBar.clientWidth;
    const total=boardWrap.scrollWidth;
    const view=boardWrap.clientWidth;
    const maxScroll=Math.max(0,total-view);
    const thumbW=scrollThumb.offsetWidth;
    const maxThumb=Math.max(1,track-thumbW);

    const x=e.touches[0].clientX-rect.left;
    const target=Math.max(0,Math.min(maxThumb,x-thumbW/2));

    boardWrap.scrollLeft=(target/maxThumb)*maxScroll;
    updateCauScrollbar();
  },{passive:true});

  /* Mở Cầu là đứng ngay cột cuối bên phải, không cần kéo. */
  requestAnimationFrame(()=>{
    boardWrap.scrollLeft=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );
    updateCauScrollbar();
  });

  /*
   * Vuốt 1:1 theo ngón tay.
   * Hất càng mạnh -> quán tính càng nhanh, nhưng chỉ chạy SAU khi nhả tay.
   */
  let lastTouchX=null;
  let lastTouchTime=0;
  let velocity=0;
  let inertiaFrame=0;

  boardWrap.addEventListener("touchstart",function(e){
    if(inertiaFrame){
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame=0;
    }

    if(e.touches && e.touches.length){
      lastTouchX=e.touches[0].clientX;
      lastTouchTime=performance.now();
      velocity=0;
    }
  },{passive:true});

  boardWrap.addEventListener("touchmove",function(e){
    if(lastTouchX===null || !e.touches || !e.touches.length) return;
    e.preventDefault();

    const now=performance.now();
    const x=e.touches[0].clientX;
    const dt=Math.max(8,now-lastTouchTime);
    const dx=x-lastTouchX;

    lastTouchX=x;
    lastTouchTime=now;

    const maxScroll=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );

    /* 1px ngón tay = 1px bảng, tuyệt đối không nhân tốc độ. */
    let next=boardWrap.scrollLeft-dx;

    if(next<0) next=0;
    if(next>maxScroll) next=maxScroll;

    boardWrap.scrollLeft=next;

    /* Lấy vận tốc vuốt thực tế, làm mượt để cú hất mạnh không bị mất ở frame cuối. */
    const instantVelocity=(-dx/dt)*1000;
    velocity=(velocity*0.55)+(instantVelocity*0.45);

    if(velocity>3500) velocity=3500;
    if(velocity<-3500) velocity=-3500;
  },{passive:false});

  function runInertia(){
    const maxScroll=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );

    /* Vuốt nhẹ: dừng hẳn khi nhả tay. */
    if(Math.abs(velocity)<650){
      velocity=0;
      inertiaFrame=0;
      return;
    }

    let next=boardWrap.scrollLeft+(velocity/60);

    if(next<=0){
      boardWrap.scrollLeft=0;
      velocity=0;
      inertiaFrame=0;
      return;
    }

    if(next>=maxScroll){
      boardWrap.scrollLeft=maxScroll;
      velocity=0;
      inertiaFrame=0;
      return;
    }

    boardWrap.scrollLeft=next;
    velocity*=0.93;

    inertiaFrame=requestAnimationFrame(runInertia);
  }

  boardWrap.addEventListener("touchend",function(){
    lastTouchX=null;
    lastTouchTime=0;
    runInertia();
  },{passive:true});

  boardWrap.addEventListener("touchcancel",function(){
    lastTouchX=null;
    lastTouchTime=0;
    runInertia();
  },{passive:true});

  updateCauScrollbar();

}

  return {

      rowId:rowId,
      number:"",

      created:created
    },

      rowId:rowId,
      number:"",
      locked:false,

    }

  };

}

/* =====================================================
   BUILD ROWS
===================================================== */

function buildRows(){

  const data=
    ensureCurrent();

  const map=
    new Map();

  function add(arr,type){

    arr.forEach(
      (item,index)=>{

        if(!item){
          return;
        }

        let rowId=
          item.rowId;

        if(!rowId){

          rowId=
            "legacy_"+index;

          item.rowId=
            rowId;

        }

        if(!map.has(rowId)){

          map.set(
            rowId,
            {
              rowId:rowId,
              db:null,
              g1:null,
              created:
                Number(item.created)||
                index+1
            }
          );

        }

        const row=
          map.get(rowId);

        row[type]=
          item;

        row.created=
          Math.max(
            Number(row.created)||0,
            Number(item.created)||0
          );

      }
    );

  }

  add(data.db,"db");
  add(data.g1,"g1");

  return Array
    .from(map.values())
    .sort(
      (a,b)=>
        (Number(b.created)||0)-
        (Number(a.created)||0)
    );

}

function parsePasteNumbers(
  text,
  type
){

  const len=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+len+"}$"
    );

  return String(text||"")
    .replace(/\r/g," ")
    .replace(/\n/g," ")
    .split(/[\s,;]+/)
    .map(x=>x.trim())
    .filter(
      x=>re.test(x)
    );

}

/* =====================================================
   PASTE DÀN
===================================================== */

function pasteNumbers(
  type,
  startRowId,
  numbers
){

  if(
    !numbers ||
    !numbers.length
  ){
    return;
  }

  const maxDigits=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+maxDigits+"}$"
    );

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const data=
    all[key];

  let rows=
    buildRowsFromData(data);

  let startIndex=
    rows.findIndex(
      r=>
        String(r.rowId)===
        String(startRowId)
    );

  if(startIndex<0){
    return;
  }

  while(
    rows.length<
    startIndex+
    numbers.length
  ){

    const rowId=
      "row_"+
      Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2);

    let minCreated=
      Date.now();

    [
      ...data.db,
      ...data.g1
    ].forEach(
      item=>{

        const t=
          Number(item?.created);

        if(
          Number.isFinite(t)
        ){

          minCreated=
            Math.min(
              minCreated,
              t
            );

        }

      }
    );

    const created=
      minCreated-1;

    data.db.push({

      id:rowId+"_db",
      rowId:rowId,
      number:"",
      locked:false,
      created:created

    });

    data.g1.push({

      id:rowId+"_g1",
      rowId:rowId,
      number:"",
      locked:false,
      created:created

    });

    rows=
      buildRowsFromData(data);

  }

  const arr=
    type==="db"
      ?data.db
      :data.g1;

  numbers.forEach(
    (number,i)=>{

      if(!re.test(String(number))){
        return;
      }

      const row=
        rows[
          startIndex+i
        ];

      if(!row){
        return;
      }

      let item=
        arr.find(
          x=>
            x &&
            String(x.rowId)===
            String(row.rowId)
        );

      if(!item){

        item={

          id:
            "id_"+
            Date.now()+
            "_"+
            Math.random()
              .toString(36)
              .slice(2),

          rowId:row.rowId,
          number:"",
          locked:false,
          created:row.created

        };

        arr.push(item);

      }

      if(item.locked===true){
        return;
      }

      item.number=
        String(number);

      item.locked=true;

    }
  );

  saveAll(all);

}

/* =====================================================
   TẠO Ô NHẬP NGÀY
===================================================== */

function createDateInputRow(
  column,
  row
){

  const box=
    document.createElement("div");

  box.className="data-row";

  box.dataset.rowId=
    row.rowId||"";

  const input=
    document.createElement("input");

  input.type="text";
  input.inputMode="numeric";
  input.maxLength=500000;
  input.className="date-input";

  input.dataset.rowId=
    row.rowId||"";

  input.value=
    row.db?.sourceDateText ||
    row.g1?.sourceDateText ||
    row.db?.sourceDate ||
    row.g1?.sourceDate ||
    "";

  function normalizeDate(value){

    const s=
      String(value||"")
        .trim();

    const m=
      s.match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
      );

    if(!m){
      return "";
    }

    const day=
      m[1].padStart(2,"0");

    const month=
      m[2].padStart(2,"0");

    const year=
      m[3];

    return(
      day+
      "-"+
      month+
      "-"+
      year
    );

  }

  function parseDates(text){

    const raw=
      String(text||"")
        .replace(/\r/g,"\n");

    const parts=
      raw
        .split(/[\s,;]+/)
        .map(x=>x.trim())
        .filter(Boolean);

    const dates=[];

    parts.forEach(part=>{

      const date=
        normalizeDate(part);

      if(date){
        dates.push(date);
      }

    });

    return dates;

  }

  function saveSingleDate(date){

    const all=
      loadAll();

    const current=
      all[getKey()];

    if(!current){
      return;
    }

    const db=
      Array.isArray(current.db)
        ?current.db
        :[];

    const g1=
      Array.isArray(current.g1)
        ?current.g1
        :[];

    [
      ...db,
      ...g1
    ].forEach(item=>{

      if(
        item &&
        String(item.rowId)===
        String(row.rowId)
      ){

        item.sourceDate=
          date;

        if(date){

          const parts=
            date.split("-");

          if(parts.length===3){

            item.sourceDateText=
              parts[2]+"/"+
              parts[1]+"/"+
              parts[0];

          }

        }else{

          item.sourceDateText="";

        }

      }

    });

    saveAll(all);

  }

  function saveBulkDates(dates){

    if(
      !Array.isArray(dates) ||
      !dates.length
    ){
      return;
    }

    const all=
      loadAll();

    const key=
      getKey();

    if(!all[key]){

      all[key]={
        db:[],
        g1:[]
      };

    }

    const data=
      all[key];

    let rows=
      buildRowsFromData(data);

    const startIndex=
      rows.findIndex(
        r=>
          String(r.rowId)===
          String(row.rowId)
      );

    if(startIndex<0){
      return;
    }

    while(
      rows.length<
      startIndex+
      dates.length
    ){

      const rowId=
        "row_"+
        Date.now()+
        "_"+
        Math.random()
          .toString(36)
          .slice(2);

      let oldest=
        Date.now();

      [
        ...data.db,
        ...data.g1
      ].forEach(item=>{

        const t=
          Number(item?.created);

        if(
          Number.isFinite(t)
        ){

          oldest=
            Math.min(
              oldest,
              t
            );

        }

      });

      const created=
        oldest-1;

      data.db.push({

        id:rowId+"_db",
        rowId:rowId,
        number:"",
        locked:false,
        created:created,
        sourceDate:"",
        sourceDateText:""

      });

      data.g1.push({

        id:rowId+"_g1",
        rowId:rowId,
        number:"",
        locked:false,
        created:created,
        sourceDate:"",
        sourceDateText:""

      });

      rows=
        buildRowsFromData(data);

    }

    dates.forEach(
      (date,i)=>{

        const targetRow=
          rows[
            startIndex+i
          ];

        if(!targetRow){
          return;
        }

        const parts=
          date.split("-");

        const displayDate=
          parts.length===3
            ?(
              parts[2]+"/"+
              parts[1]+"/"+
              parts[0]
            )
            :"";

        [
          ...data.db,
          ...data.g1
        ].forEach(item=>{

          if(
            item &&
            String(item.rowId)===
            String(targetRow.rowId)
          ){

            item.sourceDate=
              date;

            item.sourceDateText=
              displayDate;

          }

        });

      }
    );

    saveAll(all);

  }

  input.addEventListener(
    "input",
    function(){

      const raw=
        String(input.value||"");

      const dates=
        parseDates(raw);

      if(dates.length>1){

        input.value="";

        saveBulkDates(dates);

        requestAnimationFrame(()=>{
          renderInputLists();
        });

        return;

      }

      if(dates.length===1){

        const date=
          dates[0];

        input.value=
          date;

        saveSingleDate(date);

        return;

      }

      let v=
        raw
          .replace(/\D/g,"")
          .slice(0,8);

      if(v.length>2){

        v=
          v.slice(0,2)+
          "-"+
          v.slice(2);

      }

      if(v.length>5){

        v=
          v.slice(0,5)+
          "-"+
          v.slice(5);

      }

      input.value=v;

    }
  );

  input.addEventListener(
    "paste",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      let text="";

      try{

        text=
          e.clipboardData
            ?(
              e.clipboardData.getData("text/plain") ||
              e.clipboardData.getData("text") ||
              ""
            )
            :"";

      }catch(err){

        text="";

      }

      const dates=
        parseDates(text);

      if(!dates.length){
        return;
      }

      if(dates.length===1){

        input.value=
          dates[0];

        saveSingleDate(
          dates[0]
        );

        return;

      }

      saveBulkDates(dates);

      input.value="";

      requestAnimationFrame(()=>{
        renderInputLists();
      });

    },
    true
  );

  input.addEventListener(
    "change",
    function(){

      const date=
        normalizeDate(
          input.value
        );

      if(!date){

        input.value="";
        saveSingleDate("");
        return;

      }

      input.value=
        date;

      saveSingleDate(
        date
      );

      loadLatest();

    }
  );

  box.appendChild(input);
  column.appendChild(box);

}

/* =====================================================
   TẠO Ô NHẬP DB / G1
===================================================== */

function createInputRow(
  column,
  type,
  item,
  rowId
){

  const maxDigits =
    digitLength(type);

  const digitRe =
    new RegExp(
      "^\\d{" + maxDigits + "}$"
    );

  const row =
    document.createElement("div");

  row.className = "data-row";

  row.dataset.rowId =
    rowId || "";

  row.dataset.type =
    type;

  const input =
    document.createElement("textarea");

  input.className = "row-input";

  if(type === "db"){
    input.classList.add("db-input");
  }

  if(type === "g1"){
    input.classList.add("g1-input");
  }

  input.inputMode = "numeric";

  input.maxLength = 50000;

  input.rows = 1;

  input.wrap = "off";

  input.autocomplete = "off";

  input.spellcheck = false;

  input.setAttribute(
    "enterkeyhint",
    "next"
  );

  input.dataset.rowId =
    rowId || "";

  input.dataset.type =
    type;

  input.value =
  item
    ? (
        type === "db"
          ? formatVietlottData(item.number)
          : String(item.number || "")
      )
    : "";

  /*
    KHÔNG tự khóa khi nhập đủ số.
    Cho phép người dùng sửa lại số đã nhập sai.
  */

  input.readOnly = false;

  input.classList.remove("locked");


  row.appendChild(input);

  column.appendChild(row);


  /* =========================
     PASTE
     ========================= */

  input.addEventListener(
    "paste",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      const text =
        e.clipboardData
          ? e.clipboardData.getData("text")
          : "";

      const numbers =
        parsePasteNumbers(
          text,
          type
        );

      if(!numbers.length){
        return;
      }


      if(numbers.length > 1){

        pasteNumbers(
          type,
          rowId,
          numbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      if(numbers.length === 1){

        const number =
          numbers[0];

        if(item){

          updateItem(
            type,
            item.id,
            number
          );

        }else{

          addNumber(
            type,
            number,
            rowId
          );

        }

        /*
          KHÔNG lock ở đây.
          Cho phép sửa tiếp nếu nhập nhầm.
        */

        input.readOnly = false;

        input.classList.remove(
          "locked"
        );

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

      }

    },
    true
  );


  /* =========================
     INPUT
     ========================= */

  input.addEventListener(
    "input",
    function(){

      const raw =
        String(
          input.value || ""
        );


      const bulkNumbers =
        parsePasteNumbers(
          raw,
          type
        );


      if(
        bulkNumbers.length > 1
      ){

        pasteNumbers(
          type,
          rowId,
          bulkNumbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      if(
        bulkNumbers.length === 1 &&
        /[\s,;\n\r]/.test(raw)
      ){

        pasteNumbers(
          type,
          rowId,
          bulkNumbers
        );

        input.value = "";

        requestAnimationFrame(
          ()=>{
            renderInputLists();
          }
        );

        return;
      }


      let value =
        raw
          .replace(/\D/g,"")
          .slice(0,maxDigits);


      input.value = value;


      if(item){

        updateItem(
          type,
          item.id,
          value
        );

        /*
          QUAN TRỌNG:
          Không lock khi đủ số.
        */

        return;
      }


      /*
        Dòng mới:
        nhập đủ số thì tạo dữ liệu,
        nhưng vẫn để ô nhập mở để sửa.
      */

      if(
        value.length === maxDigits
      ){

        addNumber(
          type,
          value,
          rowId
        );

        input.readOnly = false;

        input.classList.remove(
          "locked"
        );

      }

    }
  );


  /* =========================
     ENTER
     ========================= */

  input.addEventListener(
    "keydown",
    function(e){

      if(e.key !== "Enter"){
        return;
      }

      e.preventDefault();


      const value =
        input.value
          .replace(/\D/g,"")
          .slice(0,maxDigits);


      input.value = value;


      if(
        value.length !== maxDigits
      ){
        return;
      }


      if(item){

        updateItem(
          type,
          item.id,
          value
        );

      }else{

        addNumber(
          type,
          value,
          rowId
        );

      }


      /*
        KHÔNG khóa ô sau khi Enter.
        Vẫn cho phép sửa.
      */

      input.readOnly = false;

      input.classList.remove(
        "locked"
      );


      if(document.activeElement){
        document.activeElement.blur();
      }


      renderInputLists();

    }
  );

}

/* =====================================================
   KHÓA ITEM
===================================================== */

function lockItem(
  type,
  id
){

  if(!id){
    return;
  }

  const maxDigits=
    digitLength(type);

  const re=
    new RegExp(
      "^\\d{"+maxDigits+"}$"
    );

  const all=
    loadAll();

  const current=
    all[getKey()];

  if(!current){
    return;
  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const item=
    arr.find(
      x=>x.id===id
    );

  if(!item){
    return;
  }

  if(
    re.test(
      String(item.number||"")
    )
  ){

    item.locked=true;

    saveAll(all);

  }

}

/* =====================================================
   CẬP NHẬT ITEM
===================================================== */

function updateItem(
  type,
  id,
  number
){

  const maxDigits=
    digitLength(type);

  const all=
    loadAll();

  const current=
    all[getKey()];

  if(!current){
    return;
  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const item=
    arr.find(
      x=>x.id===id
    );

  if(!item){
    return;
  }

  if(item.locked===true){
    return;
  }

  item.number=
    String(number)
      .replace(/\D/g,"")
      .slice(0,maxDigits);

  if(
    item.number.length===maxDigits
  ){

    item.locked=true;

  }

  saveAll(all);

}

/* =====================================================
   THÊM SỐ
===================================================== */

function addNumber(
  type,
  number,
  rowId
){

  const maxDigits=
    digitLength(type);

  number=
    String(number)
      .replace(/\D/g,"")
      .slice(0,maxDigits);

  if(
    number.length!==maxDigits
  ){
    return;
  }

  const all=
    loadAll();

  const key=
    getKey();

  if(!all[key]){

    all[key]={
      db:[],
      g1:[]
    };

  }

  const current=
    all[key];

  const now=
    Date.now();

  const id=
    now+
    "_"+
    Math.random()
      .toString(36)
      .slice(2);

  let finalRowId=
    rowId;

  if(!finalRowId){

    finalRowId=
      "row_"+
      now+
      "_"+
      Math.random()
        .toString(36)
        .slice(2);

  }

  const arr=
    type==="db"
      ?current.db
      :current.g1;

  const existing=
    arr.find(
      x=>
        x &&
        String(x.rowId)===
        String(finalRowId)
    );

  if(existing){

    if(existing.locked===true){
      return;
    }

    existing.number=
      number;

    existing.locked=true;

    saveAll(all);

    return;

  }

  arr.push({

    id:id,
    rowId:finalRowId,
    number:number,
    locked:true,
    created:now

  });

  saveAll(all);

}

/* =====================================================
   KHỞI ĐỘNG
===================================================== */

renderStations();

/* Lấy toàn bộ KQ Worker 1 lần khi mở app */
startAutoSync();

/* =====================================================
   KHỞI TẠO MÀN CHỌN ĐÀI
   Đảm bảo mở app là hiện ngay danh sách đài MB.
===================================================== */
function initStationScreen(){
  currentRegion="vietlott";
  currentPosition="dbVan";

  document
    .querySelectorAll(".region-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.region==="mb"
      );
    });

  renderStations();
}

if(document.readyState==="loading"){
  document.addEventListener(
    "DOMContentLoaded",
    initStationScreen,
    {once:true}
  );
}else{
  requestAnimationFrame(initStationScreen);
}
